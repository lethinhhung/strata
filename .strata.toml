[models.strong]
provider = "codex"
model = "gpt-6-luna"
command = "codex"
timeout_seconds = 3600
extra_args = ["--config", 'model_reasoning_effort="medium"']

[models.worker]
provider = "opencode"
model = "nvidia/openai/gpt-oss-20b"
command = "opencode"
extra_args = ["--variant", "low"]
timeout_seconds = 1800

[workflow]
max_repairs = 2
checkpoint = true
checkpoint_prefix = "strata"
spec_paths = ["specs", "RULES.md", "AGENTS.md"]
memory_path = "memory"
memory_policy = "memory/README.md"
test_commands = [["pnpm", "--filter", "@snapnote/mobile", "exec", "jest", "--runInBand", "src/features/expenses/categories.test.ts"]]

[quality_checks.typecheck]
command = ["pnpm", "--filter", "@snapnote/mobile", "typecheck"]
