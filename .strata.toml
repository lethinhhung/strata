# Model IDs are interpreted by the local CLIs; credentials stay outside this file.
[models.strong]
provider = "codex"
model = "gpt-6-luna"
command = "codex"
timeout_seconds = 3600
extra_args = ["--config", 'model_reasoning_effort="medium"']

[models.worker]
provider = "opencode"
model = "nvidia/nvidia/nemotron-3-super-120b-a12b"
command = "opencode"
timeout_seconds = 1800

[workflow]
max_repairs = 2
review_repair_attempts = 3
test_repair_attempts = 3
validation_repair_attempts = 2
checkpoint = true
checkpoint_prefix = "strata"
spec_paths = ["specs", "RULES.md", "TYPESCRIPT_REFACTOR_EPIC.md"]
memory_path = "memory"
memory_policy = ""
setup_commands = [["npm", "ci"]]
quality_checks = [["npm", "run", "typecheck"], ["npm", "run", "lint"]]
test_commands = [["npm", "run", "test:ci"]]
